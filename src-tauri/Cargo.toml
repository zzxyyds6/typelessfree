[package]
name = "typelessfree"
version = "0.1.0"
description = "开源、免费、本地优先的 AI 语音输入工具"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
