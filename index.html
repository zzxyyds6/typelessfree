<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>typelessfree</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <h1>typelessfree 设置</h1>

      <section class="settings">
        <h2>快捷键</h2>
        <div class="row">
          <span class="label">修饰键</span>
          <label class="check"><input type="checkbox" id="mod-control" /> Ctrl</label>
          <label class="check"><input type="checkbox" id="mod-shift" /> Shift</label>
          <label class="check"><input type="checkbox" id="mod-alt" /> Alt</label>
          <label class="check"><input type="checkbox" id="mod-super" /> Win/Cmd</label>
        </div>
        <div class="row">
          <span class="label">主键</span>
          <select id="hotkey-key">
            <option value="space">Space</option>
            <option value="q">Q</option>
            <option value="z">Z</option>
            <option value="d">D</option>
            <option value="v">V</option>
            <option value="f1">F1</option>
            <option value="f2">F2</option>
            <option value="f3">F3</option>
            <option value="f4">F4</option>
          </select>
        </div>
        <div class="row">
          <span class="label">触发模式</span>
          <label class="check"><input type="radio" name="mode" id="mode-hold" value="hold" /> 按住说话</label>
          <label class="check"><input type="radio" name="mode" id="mode-toggle" value="toggle" /> 按一次开始/结束</label>
        </div>

        <h2>语音识别</h2>
        <div class="row">
          <span class="label">模型</span>
          <select id="model">
            <option value="tiny">tiny（最快）</option>
            <option value="base">base（推荐）</option>
            <option value="small">small</option>
            <option value="medium">medium</option>
            <option value="large-v3-turbo">large-v3-turbo（最准）</option>
          </select>
        </div>
        <div class="row">
          <span class="label">语言</span>
          <select id="language">
            <option value="auto">自动检测</option>
            <option value="zh">中文</option>
            <option value="en">English</option>
          </select>
        </div>

        <h2>AI 文本清理（可选）</h2>
        <div class="row">
          <span class="label">启用</span>
          <label class="check"><input type="checkbox" id="cleanup-enabled" /> 开启后文本将发送到下方端点</label>
        </div>
        <div class="row">
          <span class="label">端点</span>
          <input type="text" id="cleanup-endpoint" placeholder="http://localhost:11434/v1/chat/completions" />
        </div>
        <div class="row">
          <span class="label">模型名</span>
          <input type="text" id="cleanup-model" placeholder="llama3.2" />
        </div>
        <div class="row">
          <span class="label">API Key</span>
          <input type="password" id="cleanup-api-key" placeholder="本地 Ollama 可留空" />
        </div>
        <div class="row">
          <span class="label">提示词</span>
          <textarea id="cleanup-prompt" rows="3"></textarea>
        </div>

        <h2>个人词典 / 热词</h2>
        <div class="row">
          <span class="label">热词</span>
          <textarea id="hotwords" rows="5" placeholder="每行一个专有名词 / 人名 / 术语"></textarea>
        </div>
        <div class="row">
          <span class="label"></span>
          <button id="hotwords-import" class="secondary">导入（配置目录 hotwords.json）</button>
          <button id="hotwords-export" class="secondary">导出到 hotwords.json</button>
        </div>
      </section>

      <div class="save-bar">
        <button id="save">保存设置</button>
        <span id="save-tip"></span>
      </div>

      <section class="status-area">
        <p id="status"></p>
        <pre id="result"></pre>
        <p id="progress" class="muted"></p>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
